  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://soneraltin.com/" },
      { "@type": "ListItem", "position": 2, "name": "Apps", "item": "https://soneraltin.com/apps/" },
      { "@type": "ListItem", "position": 3, "name": "Kelime Düello", "item": "https://soneraltin.com/apps/kelimeduelo/challenge/" }
    ]
  }
  </script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      font-family: ui-rounded, system-ui, -apple-system, sans-serif;
      background: #0C0C11; color: #F4F1F8; padding: 24px; text-align: center;
    }
    .card {
      max-width: 22rem; padding: 28px 22px; border-radius: 24px;
      background: #17141F; border: 1px solid #2A2436;
    }
    .icon {
      width: 72px; height: 72px; border-radius: 18px; object-fit: cover;
      margin: 0 auto 16px; display: block;
    }
    h1 { font-size: 1.55rem; margin: 0 0 8px; }
    p { color: #A89EB8; margin: 0 0 20px; line-height: 1.45; }
    a.btn {
      display: inline-block; padding: 14px 22px; border-radius: 999px;
      background: #7DDEBA; color: #16121C; font-weight: 700; text-decoration: none;
    }
    .meta { margin-top: 18px; font-size: 0.85rem; color: #7A718C; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/screenshots/kelimeduelo/og-share.png" alt="Kelime Düello" width="72" height="72">
    <h1>Kelime Düello</h1>
    <p id="copy">Bir arkadaşın seni meydan okumaya çağırdı. Uygulamayı açıp aynı oyunu oyna.</p>
    <a class="btn" id="open" href="kelimeduelo://challenge">Uygulamayı aç</a>
    <p class="meta" id="hint"></p>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const challengeId = q.get("c");
    const mode = q.get("mode") || "solo";
    const len = q.get("len");
    const u = q.get("u");
    const day = q.get("day");
    const format = q.get("format");
    const parts = [];
    if (challengeId) {
      parts.push("aynı kelime meydanı");
    } else {
      if (u) parts.push("@" + u);
      if (mode === "daily") parts.push("günün yarışı");
      else if (mode === "duel") parts.push("düello");
      else if (mode === "bot") parts.push("antrenman");
      else parts.push("solo");
      if (len) parts.push(len + " harf");
      if (format) parts.push(format);
      if (day) parts.push(day);
    }
    if (parts.length) {
      const line = parts.join(" · ");
      document.getElementById("copy").textContent =
        line + ". Kelime Düello’da seni geçmeye çalış.";
      document.getElementById("hint").textContent = line;
      document.title = line + " · Kelime Düello";
    }
    const qs = q.toString();
    const deep = "kelimeduelo://challenge" + (qs ? ("?" + qs) : "");
    document.getElementById("open").href = deep;
    // Universal Link yüklü uygulamada Safari’siz açar; yedek deep link.
    setTimeout(function () {
      try { location.href = deep; } catch (_) {}
    }, 120);
  </script>
</body>
</html>
